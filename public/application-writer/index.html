<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application Writer | Akshaya PKP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Tinos:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#0798e8;--line:#d8e5f3;--ink:#1e293b;--muted:#64748b}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,"Noto Sans Malayalam",sans-serif;color:var(--ink);background:#eaf6ff}body{overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:392px minmax(0,1fr);grid-template-rows:44px minmax(0,1fr);gap:0;padding:0}.appbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#fff;border-bottom:1px solid #dce9f7;box-shadow:0 2px 9px #0f3d6610;z-index:2}.brand{display:flex;align-items:center;gap:8px;color:#0879b9;font-size:14px;font-weight:800}.brand-mark{font-size:18px}.appbar-actions{display:flex;gap:8px;align-items:center}.appbar .btn{padding:5px 12px;border-radius:18px;font-size:10px}.panel,.editor{min-height:0;background:#fff;border:0;border-radius:0;box-shadow:none}.panel{overflow:auto;padding:12px 16px;background:#f8fbff;border-right:1px solid #dce8f5}.panel h2{font-size:14px;margin:0 0 12px}.field{margin:0 0 8px}.field label{display:block;font-size:11px;font-weight:650;color:#526176;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #b9ddfb;border-radius:8px;padding:7px 9px;font:11px Inter,"Noto Sans Malayalam",sans-serif;color:#243247;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:#0ea5e9;box-shadow:0 0 0 2px #0ea5e91c}textarea{min-height:62px;resize:vertical;line-height:1.45}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.hint{font-size:10px;color:#8793a5}.switch{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.switch button{flex:1;padding:9px;border:0;background:#fff;font-size:11px;font-weight:700}.switch button.active{background:#2563eb;color:#fff}.btn{border:1px solid #d7e1ed;background:#fff;border-radius:9px;padding:9px 12px;font-size:11px;font-weight:700;cursor:pointer;color:#334155}.btn.primary{background:linear-gradient(110deg,#18a8ed,#8b3cf0);border:0;color:white;box-shadow:0 5px 12px #5289e044}.btn:disabled{opacity:.5}.full{width:100%;margin:3px 0}.group{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#64748b;font-weight:800;margin:18px 0 10px;padding-top:13px;border-top:1px solid #e8edf3}.note{font-size:10px;color:#64748b;line-height:1.5}.editor{display:flex;flex-direction:column;overflow:hidden;background:#f4faff}.top{display:none}.actions{display:flex;gap:6px;flex-wrap:wrap}.toolbar{display:flex;gap:3px;align-items:center;padding:6px 12px;background:#fff;border-bottom:1px solid #e0e9f3;flex-wrap:wrap;min-height:43px}.toolbar button,.toolbar select{border:0;background:#fff;border-radius:5px;padding:6px 8px;font-size:12px;cursor:pointer}.toolbar button:hover{background:#eff6ff}.toolbar select{border:1px solid var(--line);width:auto;padding:5px}.workspace{flex:1;overflow:auto;padding:18px 20px;display:flex;justify-content:center;align-items:flex-start;background:linear-gradient(120deg,#e6f5ff,#f3efff)}.paper-wrap{width:min(100%,900px);transform-origin:top center}.paper{width:100%;min-height:1123px;background:white;box-shadow:0 7px 25px #17255418;padding:100px 84px 55px;position:relative;font:17px/1.9 "Tinos","Noto Sans Malayalam",serif;color:#172033;outline:1px solid #edf0f4}.empty-guide{height:192px;border:1px dashed #cbd5e1;border-radius:7px;margin:0 auto 46px;max-width:100%;padding:10px 12px;color:#94a3b8;font:italic 14px/1.7 Inter,"Noto Sans Malayalam",sans-serif}.paper.has-content .empty-guide{display:none}.paper .content{min-height:280px}.paper .footer{margin-top:42px;font:17px/1.8 "Noto Sans Malayalam",serif}.hidden-legacy{display:none!important}.toolbar-spacer{flex:1}.action-pair{margin-top:2px}.action-pair .btn{width:100%;border-color:#0798e8;color:#0879b9}.panel h2{font-size:14px}.panel .note{margin-top:12px}.letterhead{display:grid;grid-template-columns:74px 1fr 62px;gap:10px;align-items:center;padding-bottom:12px;margin-bottom:22px;border-bottom:2px solid #2563eb}.logo{width:66px;height:62px;display:grid;place-items:center;border:1px dashed #aab6c8;border-radius:8px;font:700 10px Inter,sans-serif;color:#334155;text-align:center;overflow:hidden}.logo img{max-width:100%;max-height:100%;object-fit:contain}.centre{text-align:center;font-family:Inter,sans-serif}.centre-name{font-size:20px;font-weight:800;line-height:1.25}.centre-meta{font-size:10px;line-height:1.5;margin-top:4px;color:#475569}.right-logo{width:52px;height:58px;margin:auto;display:grid;place-items:center;text-align:center;font:800 9px Inter,sans-serif;color:#b38616;border:1px solid #e6c65b;border-radius:8px}.docdate{text-align:right;font-size:12px;margin:0 0 24px}.heading{text-align:center;font:700 17px Inter,"Noto Sans Malayalam",sans-serif;text-decoration:underline;text-underline-offset:5px;margin:0 0 28px}.content{min-height:580px;outline:none;white-space:pre-wrap;overflow-wrap:anywhere}.content:empty:before{content:"അപേക്ഷയുടെ ഉള്ളടക്കം ഇവിടെ തയ്യാറാക്കുക / Generate ചെയ്യുക";color:#94a3b8}.footer{display:flex;justify-content:space-between;gap:25px;margin-top:45px;font-size:13px}.editable{outline:none;cursor:text}.editable:focus{background:#eff6ff80;outline:1px dashed #60a5fa}.place-date{white-space:pre-line}.status{font-size:11px;margin-top:7px}.error{color:#b91c1c}.success{color:#166534}.modal{display:none;position:fixed;inset:0;z-index:50;background:#0f172a88;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal-card{width:min(620px,100%);max-height:80vh;overflow:auto;background:#fff;border-radius:14px;padding:16px;box-shadow:0 20px 60px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.history-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #e5eaf0;font-size:12px}.history-row button{margin-left:5px}.floating-tools{position:fixed;z-index:40;display:none;gap:4px;padding:6px;background:#172554;color:white;border-radius:9px;box-shadow:0 8px 25px #0003}.floating-tools button{border:0;border-radius:5px;padding:6px 8px;background:transparent;color:white;cursor:pointer}.floating-tools button:hover{background:#334155}
.style-crimson .letterhead{border-bottom:3px double #991b1b}.style-centered .letterhead{grid-template-columns:1fr;text-align:center}.style-centered .logo,.style-centered .right-logo{display:none}.style-blue .letterhead{background:#eff6ff;border-bottom:5px solid #2563eb;padding:12px;border-radius:6px}.style-side .letterhead{border-left:7px solid #2563eb;padding-left:12px;border-bottom:0}.style-minimal .letterhead{border-bottom:1px solid #111}.style-formal .paper{outline:3px double #64748b;outline-offset:-12px}.style-government .letterhead{border-bottom:3px solid #b8860b}.style-navy .letterhead{background:#172554;color:#fff;padding:12px;border-radius:6px}.style-navy .centre-meta{color:#e2e8f0}.style-boxed .letterhead{border:2px solid #334155;padding:12px}
@media(max-width:900px){body{height:auto;overflow:auto}.app{height:auto;min-height:100vh;grid-template-columns:1fr;grid-template-rows:44px auto minmax(760px,1fr)}.appbar{position:sticky;top:0}.panel{max-height:none;border-right:0;border-bottom:1px solid #dce8f5}.editor{min-height:760px}.workspace{padding:8px}.paper{padding:35px 28px;min-height:1000px}.actions{width:auto}}
@media print{@page{size:A4;margin:0}html,body{height:auto;background:#fff!important;overflow:visible!important}.app{display:block;height:auto;padding:0}.panel,.appbar,.top,.toolbar{display:none!important}.editor,.workspace,.paper-wrap{display:block;overflow:visible;padding:0;margin:0;border:0;box-shadow:none;width:210mm}.paper{width:210mm;height:297mm;min-height:297mm;padding:20mm 20mm;box-shadow:none;outline:0;print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head><body><div class="app">
<header class="appbar"><div class="brand"><span class="brand-mark">▰</span><span>Application Writer</span></div><div class="appbar-actions"><button class="btn" id="newTop">✚ New</button><button class="btn" id="historyTop">◷ History</button><button class="btn primary" id="backTop">← Back to Dashboard</button></div></header>
<aside class="panel"><h2>✎ Write Application</h2>
<div class="field"><label for="to">To <span class="hint">(who is it addressed to)</span></label><input id="to" placeholder="e.g. Secretary, Parappanangadi Municipality"></div>
<div class="field"><label for="from">From (name, house, place, ward)</label><textarea id="from" placeholder="Applicant name and address"></textarea></div>
<div class="field"><label for="description">What is it about? (Malayalam or English)</label><textarea id="description" placeholder="Describe the matter with important details, names, dates and what is requested..."></textarea><div class="hint" id="count">Characters: 0</div></div>
<div class="row"><div class="field"><label for="type">Type</label><select id="type"><option value="application">Application</option><option value="complaint">Complaint</option><option value="affidavit">Affidavit</option><option value="request">Request Letter</option><option value="declaration">Self Declaration</option><option value="undertaking">Undertaking</option><option value="consent">Consent Letter</option><option value="explanation">Explanation</option><option value="appeal">Appeal</option><option value="custom">Other / Custom</option></select></div><div class="field"><label for="length">Characters (100–1800)</label><input id="length" type="number" min="100" max="1800" step="50" value="1000"></div></div>
<div class="field hidden-legacy"><label>Output language</label><div class="switch"><button id="en" class="active" type="button">English</button><button id="ml" type="button">മലയാളം</button></div></div>
<div class="field hidden-legacy"><label for="letterheadStyle">Letterhead style</label><select id="letterheadStyle"><option value="modern">Modern Ribbon</option><option value="crimson">Crimson Classic</option><option value="centered">Classic Centered</option><option value="blue">Modern Blue Bar</option><option value="side">Side Accent</option><option value="minimal">Minimal Line</option><option value="formal">Formal Bordered</option><option value="government">Government Official</option><option value="navy">Corporate Navy</option><option value="boxed">Boxed Header</option></select></div>
<button class="btn primary full" id="generate">✦ Generate</button><div class="row"><div class="field"><label for="placeInput">Place</label><input id="placeInput" placeholder="e.g. Koovappally"></div><div class="field"><label for="dateInput">Date</label><input id="dateInput" type="date"></div></div><div class="row action-pair"><button class="btn" id="save">▣ Save</button><button class="btn" id="print">▣ Print</button></div><button class="btn primary full" id="pdf">⇩ Download A4 PDF</button><div id="status" class="status"></div>
 </aside>
<main class="editor">
<div class="toolbar"><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="strikeThrough">S̶</button><select id="fontSize"><option value="3">Size</option><option value="2">10</option><option value="3">12</option><option value="4">14</option><option value="5">18</option><option value="6">24</option></select><button data-cmd="justifyLeft">☰</button><button data-cmd="justifyCenter">≡</button><button data-cmd="justifyRight">☷</button><button data-cmd="justifyFull">☷</button><button data-cmd="insertUnorderedList">☷</button><button data-cmd="insertOrderedList">1.</button><button id="undo">↶</button><button id="redo">↷</button><button id="clearFormat">◈</button><span class="toolbar-spacer"></span><span class="hint" id="charStatus">0 chars · Fits the A4 page</span><button id="zoomIn">⌕＋</button><button id="zoomOut">⌕−</button><button id="zoomReset">⛶</button><input id="textColor" type="color" value="#111827" title="Text colour" style="width:30px;height:26px;padding:2px;border:1px solid #dbe4ef;border-radius:5px"></div>
<section class="workspace"><div class="paper-wrap" id="paperWrap"><article class="paper" id="paper">
<div class="empty-guide" id="emptyGuide">Fill in the details on the left and press Generate. The application appears here in the standard Malayalam format, and you can edit it directly.</div>
<h2 class="heading editable" contenteditable="true" id="heading" hidden>അപേക്ഷ</h2>
<div class="content editable" contenteditable="true" id="content" spellcheck="true"></div>
<div class="footer"><div class="place-date editable" contenteditable="true" id="place">സ്ഥലം:</div><div class="editable" contenteditable="true" id="signature">ഒപ്പ്:<br><br>വിശ്വസ്തതയോടെ,</div></div>
<div id="dateLine" hidden></div><div id="logo" hidden></div><div id="centreName" hidden></div><div id="centreMeta" hidden></div><div id="rightLogo" hidden></div>
</article></div></section></main></div><div class="floating-tools" id="floatingTools"><button data-fmt="bold"><b>B</b></button><button data-fmt="italic"><i>I</i></button><button data-fmt="underline"><u>U</u></button><button data-fmt="justifyLeft">☰</button><button data-fmt="justifyCenter">≡</button></div><div class="modal" id="historyModal"><div class="modal-card"><div class="modal-head"><strong>Saved Applications</strong><button class="btn" id="closeHistory">Close</button></div><input id="historySearch" placeholder="Search recipient, applicant or document type"><div id="historyList"></div></div></div><input type="file" id="logoUpload" accept="image/*" hidden><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(()=>{const $=id=>document.getElementById(id);let lang="en",zoom=1,busy=false;const types={application:["APPLICATION","അപേക്ഷ"],complaint:["COMPLAINT","പരാതി"],affidavit:["AFFIDAVIT","സത്യവാങ്മൂലം"],request:["REQUEST LETTER","അഭ്യർത്ഥനാകത്ത്"],declaration:["SELF DECLARATION","സ്വയം സാക്ഷ്യപത്രം"],undertaking:["UNDERTAKING","ഉത്തരവാദിത്ത പ്രഖ്യാപനം"],consent:["CONSENT LETTER","സമ്മതപത്രം"],explanation:["EXPLANATION","വിശദീകരണക്കത്ത്"],appeal:["APPEAL","അപ്പീൽ"],custom:["DOCUMENT","രേഖ"]};
function status(t,err=false){$("status").className="status "+(err?"error":"success");$("status").textContent=t}
function payload(){return {to:$("to").value,from:$("from").value,description:$("description").value,type:$("type").value,language:lang,length:Number($("length").value)}}
function setLang(l){lang=l;$("en").classList.toggle("active",l==="en");$("ml").classList.toggle("active",l==="ml");$("heading").textContent=types[$("type").value][l==="ml"?1:0]}
$("en").onclick=()=>setLang("en");$("ml").onclick=()=>setLang("ml");$("type").onchange=()=>$("heading").textContent=types[$("type").value][lang==="ml"?1:0];
$("description").oninput=()=>{$("count").textContent="Characters: "+$("description").value.length;$("charStatus").textContent=$("content").innerText.length+" chars · Fits the A4 page"};
$("letterheadStyle").onchange=()=>{};
document.querySelectorAll("[data-cmd]").forEach(b=>b.onclick=()=>{ $("content").focus();document.execCommand(b.dataset.cmd,false,null)});
$("fontSize").onchange=()=>{ $("content").focus();document.execCommand("fontSize",false,$("fontSize").value)};
$("undo").onclick=()=>document.execCommand("undo");$("redo").onclick=()=>document.execCommand("redo");
function setZoom(){ $("paperWrap").style.width=(Math.min(100,zoom*100))+"%";$("zoomLabel").textContent=Math.round(zoom*100)+"%"}
$("zoomIn").onclick=()=>{zoom=Math.min(1.35,zoom+.1);setZoom()};$("zoomOut").onclick=()=>{zoom=Math.max(.55,zoom-.1);setZoom()};$("zoomReset").onclick=()=>{zoom=1;setZoom()};
async function call(){if(busy)return;busy=true;$("generate").disabled=true;status("Generating application…");try{const r=await fetch("/api/application-writer/generate",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload())});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||"Request failed");$("content").innerText=d.content;$("heading").textContent=d.heading||types[$("type").value][lang==="ml"?1:0];$("paper").classList.add("has-content");status("Application generated. You can edit it directly in the preview.");}catch(e){status(e.message||"Could not complete request.",true)}finally{busy=false;$("generate").disabled=false}}
$("generate").onclick=()=>{if(!$("description").value.trim()){status("Please enter what the application is about.",true);$("description").focus();return}call()};
 
function snapshot(){return {form:payload(),placeInput:$("placeInput").value,dateInput:$("dateInput").value,letterhead:$("letterheadStyle").value,logo:$("logo").innerHTML,centreName:$("centreName").innerHTML,centreMeta:$("centreMeta").innerHTML,rightLogo:$("rightLogo").innerHTML,dateLine:$("dateLine").innerHTML,heading:$("heading").innerHTML,content:$("content").innerHTML,place:$("place").innerHTML,signature:$("signature").innerHTML}}
function restore(d){if(!d)return;const f=d.form||{};for(const k of ["to","from","description","type","length"])if(f[k]!=null)$(k).value=f[k];$("placeInput").value=d.placeInput||"";$("dateInput").value=d.dateInput||"";setLang(f.language||"ml");$("letterheadStyle").value=d.letterhead||"modern";$("letterheadStyle").onchange();for(const k of ["logo","centreName","centreMeta","rightLogo","dateLine","heading","content","place","signature"])if(d[k]!=null)$(k).innerHTML=d[k];$("paper").classList.toggle("has-content",!!$("content").innerText.trim())}
function readHistory(){try{return JSON.parse(localStorage.getItem("akp_application_writer_history")||"[]")}catch{return []}}function writeHistory(list){localStorage.setItem("akp_application_writer_history",JSON.stringify(list.slice(0,100)))}function saveDraft(show=true){const d=snapshot(),list=readHistory();d.id=Date.now();d.savedAt=new Date().toISOString();list.unshift(d);writeHistory(list);localStorage.setItem("akp_application_writer_draft",JSON.stringify(d));if(show)status("Draft saved in this browser.")}function renderHistory(){const q=$("historySearch").value.trim().toLowerCase(),list=readHistory().filter(d=>[d.form?.to,d.form?.from,d.form?.type].join(" ").toLowerCase().includes(q));$("historyList").innerHTML=list.length?list.map(d=>`<div class="history-row"><div><b>${escapeHtml(d.form?.to||"Application")}</b><div class="hint">${escapeHtml(d.form?.type||"Document")} · ${new Date(d.savedAt).toLocaleString()}</div></div><div><button class="btn" data-open="${d.id}">Open</button><button class="btn" data-delete="${d.id}">Delete</button></div></div>`).join(""):"<p class=hint>No saved applications found.</p>"}function escapeHtml(s){return String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}$("save").onclick=()=>saveDraft();
function openHistory(){$("historySearch").value="";renderHistory();$("historyModal").classList.add("open")} $("historyTop").onclick=openHistory;$("closeHistory").onclick=()=>$("historyModal").classList.remove("open");$("historyModal").onclick=e=>{if(e.target===$("historyModal"))$("historyModal").classList.remove("open")};$("historySearch").oninput=renderHistory;$("historyList").onclick=e=>{const open=e.target.closest("[data-open]"),del=e.target.closest("[data-delete]");if(open){const d=readHistory().find(x=>String(x.id)===open.dataset.open);if(d){restore(d);$("historyModal").classList.remove("open");status("Saved application opened.")}}if(del){const id=del.dataset.delete;writeHistory(readHistory().filter(x=>String(x.id)!==id));renderHistory()}};
function startNew(){if(!confirm("Start a new application? Save the current one first if needed."))return;["to","from","description"].forEach(k=>$(k).value="");$("content").innerHTML="";$("heading").textContent=types[$("type").value][lang==="ml"?1:0];status("New application ready.")} $("newTop").onclick=startNew;
$("print").onclick=()=>window.print();$("placeInput").oninput=()=>{$("place").innerText="സ്ഥലം: "+$("placeInput").value};$("dateInput").onchange=()=>{$("dateLine").innerText=$("dateInput").value};$("content").addEventListener("input",()=>{$("paper").classList.toggle("has-content",!!$("content").innerText.trim());$("charStatus").textContent=$("content").innerText.length+" chars · Fits the A4 page"});$("clearFormat").onclick=()=>{ $("content").focus();document.execCommand("removeFormat",false,null)};$("textColor").oninput=()=>{ $("content").focus();document.execCommand("styleWithCSS",false,true);document.execCommand("foreColor",false,$("textColor").value)};document.querySelectorAll("[data-fmt]").forEach(b=>b.onclick=()=>{const ed=document.activeElement?.closest?.(".editable")||$("content");ed.focus();document.execCommand(b.dataset.fmt,false,null)});document.addEventListener("selectionchange",()=>{const s=getSelection(),f=$("floatingTools");if(!s||s.isCollapsed||!s.anchorNode||!$("paper").contains(s.anchorNode)){f.style.display="none";return}const r=s.getRangeAt(0).getBoundingClientRect();if(!r.width&&!r.height)return;f.style.display="flex";f.style.top=Math.max(8,r.top-46)+"px";f.style.left=Math.max(8,Math.min(innerWidth-f.offsetWidth-8,r.left+r.width/2-f.offsetWidth/2))+"px"});$("logo").ondblclick=()=>$("logoUpload").click();$("logo").title="Double-click to upload a centre logo or click to edit";$("logoUpload").onchange=e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith("image/"))return status("Choose an image file.",true);if(file.size>4*1024*1024)return status("Logo image must be 4 MB or smaller.",true);const reader=new FileReader();reader.onload=()=>{$("logo").innerHTML=`<img src="${reader.result}" alt="Centre logo">`;};reader.readAsDataURL(file)};
$("pdf").onclick=async()=>{const b=$("pdf");b.disabled=true;try{await document.fonts.ready;const c=await html2canvas($("paper"),{scale:2,backgroundColor:"#fff",useCORS:true});const pdf=new jspdf.jsPDF("p","mm","a4");pdf.addImage(c.toDataURL("image/jpeg",.96),"JPEG",0,0,210,297);pdf.save("Akshaya-Application.pdf")}catch(e){status("PDF export failed. Use Print → Save as PDF.",true)}finally{b.disabled=false}};
$("backTop").onclick=()=>location.href="/dashboard";
const now=new Date();$("dateInput").value=now.toISOString().slice(0,10);$("dateLine").innerText=now.toLocaleDateString("en-GB");$("place").innerText="സ്ഥലം: ";try{const d=JSON.parse(localStorage.getItem("akp_application_writer_draft")||"null");if(d)restore(d)}catch(e){}
})();
</script></body></html>
